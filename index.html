<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="xp-bar-container">
            <div id="xp-bar-fill"></div>
        </div>
        <div class="hud-top">
            <div id="hud-time">TIME: 03:00</div>
            <div id="hud-kills">KILLS: 0</div>
        </div>
        <div id="player-hp-bar">
            <div id="player-hp-fill"></div>
        </div>
    </div>

    <!-- Title Screen -->
    <div id="title-screen" class="screen">
        <h1>Seifuku vs Zombie</h1>
        <p>Survive for 3 minutes!</p>
        <button id="start-btn">START GAME</button>
    </div>

    <!-- Level Up Screen -->
    <div id="levelup-screen" class="screen hidden">
        <h2 style="color: #00ffcc; text-shadow: 0 0 20px #00ffcc;">LEVEL UP!</h2>
        <div id="upgrade-container">
            <!-- Upgrades injected here -->
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen hidden">
        <h1>GAME OVER</h1>
        <h2 id="final-score">Kills: 0</h2>
        <button id="restart-btn">TRY AGAIN</button>
    </div>

    <!-- Mobile Joystick (Hidden, touch anywhere) -->
    <!-- <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div> -->

    <script type="module" src="js/main.js"></script>
</body>
