<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Seifuku vs Zombie</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* HUD */
        .hud-top {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            font-size: 24px;
            pointer-events: none;
        }

        #xp-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: #333;
        }

        #xp-bar-fill {
            width: 0%;
            height: 100%;
            background: #00ffcc;
            transition: width 0.2s;
            box-shadow: 0 0 10px #00ffcc;
        }

        /* Player HP */
        #player-hp-bar {
            position: absolute;
            width: 60px;
            height: 6px;
            background: red;
            transform: translate(-50%, -50%);
            display: none;
            pointer-events: none;
        }

        #player-hp-fill {
            width: 100%;
            height: 100%;
            background: #0f0;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

            h1 {
                font-size: 48px;
                margin-bottom: 20px;
                color: #ff0055;
                text-shadow: 0 0 20px #ff0055;
            }

            button {
                background: #ff0055;
                color: white;
                border: none;
                padding: 15px 40px;
                font-size: 24px;
                cursor: pointer;
                border-radius: 5px;
                margin: 10px;
                transition: transform 0.1s;
            }

            button:active {
                transform: scale(0.95);
            }

            /* Mobile Controls */
            #joystick-zone {
                position: absolute;
                bottom: 50px;
                left: 50px;
                width: 150px;
                height: 150px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                display: none;
                pointer-events: auto;
            }

            #joystick-knob {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 50px;
                height: 50px;
                background: rgba(255, 255, 255, 0.5);
                border-radius: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
            }

            /* Upgrade Cards */
            #upgrade-container {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .upgrade-card {
                background: #222;
                border: 2px solid #444;
                padding: 20px;
                width: 200px;
                cursor: pointer;
                transition: all 0.2s;
                text-align: center;
            }

            .upgrade-card:hover {
                border-color: #00ffcc;
                transform: translateY(-5px);
                background: #333;
            }

            .upgrade-title {
                color: #00ffcc;
                font-size: 18px;
                margin-bottom: 10px;
                font-weight: bold;
            }

            .upgrade-desc {
                font-size: 14px;
                color: #ccc;
            }
    </style>
    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="xp-bar-container">
            <div id="xp-bar-fill"></div>
        </div>
        <div class="hud-top">
            <div id="hud-time">TIME: 03:00</div>
            <div id="hud-kills">KILLS: 0</div>
        </div>
        <div id="player-hp-bar">
            <div id="player-hp-fill"></div>
        </div>
    </div>

    <!-- Title Screen -->
    <div id="title-screen" class="screen">
        <h1>Seifuku vs Zombie</h1>
        <p>Survive for 3 minutes!</p>
        <button id="start-btn">START GAME</button>
    </div>

    <!-- Level Up Screen -->
    <div id="levelup-screen" class="screen hidden">
        <h2 style="color: #00ffcc; text-shadow: 0 0 20px #00ffcc;">LEVEL UP!</h2>
        <div id="upgrade-container">
            <!-- Upgrades injected here -->
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen hidden">
        <h1>GAME OVER</h1>
        <h2 id="final-score">Kills: 0</h2>
        <button id="restart-btn">TRY AGAIN</button>
    </div>

    <!-- Mobile Joystick (Hidden, touch anywhere) -->
    <!-- <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div> -->

    <script type="module" src="js/main.js"></script>
</body>

</html>
